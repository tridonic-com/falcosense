[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "falcosense"
version = "0.1.0"
description = "Async client for the Tridonic FalcoSENSE occupancy sensor REST and MQTT APIs"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Markus Becker" }]
keywords = ["tridonic", "falcosense", "occupancy", "people counting", "mqtt", "home assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9",
    "aiomqtt>=2.0",
]

[project.urls]
Homepage = "https://github.com/tridonic-com/falcosense"
Source = "https://github.com/tridonic-com/falcosense"
Issues = "https://github.com/tridonic-com/falcosense/issues"

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/falcosense"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "PL"]
ignore = [
    "PLR0911", # too many return statements
    "PLR0912", # too many branches (payload dispatch)
    "PLR0913", # too many arguments (client constructors)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"] # magic values are expected in test assertions

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
